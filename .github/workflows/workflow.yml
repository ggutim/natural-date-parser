name: Workflow with Maven

on:
  push:
    branches: [ "main", "release/*" ]

env:
  MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASS }}
  MAVEN_GPG_KEY: ${{ secrets.GPG_KEY }}
  CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
  CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
  PAGES_REPO_TOKEN: ${{ secrets.PAGES_REPO_TOKEN }}

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Test with Maven
        run: mvn clean test

  docs:
    name: Publish API Docs
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Generate Javadoc
        run: mvn clean compile javadoc:javadoc
      - name: Publish API docs
        if: ${{ env.PAGES_REPO_TOKEN != '' }}
        env:
          PAGES_REPO_TOKEN: ${{ secrets.PAGES_REPO_TOKEN }}
        run: |
          DOCS_REPO=ggutim/ggutim.github.io
          DOCS_DIR=$(mktemp -d)
          git clone "https://x-access-token:${PAGES_REPO_TOKEN}@github.com/${DOCS_REPO}.git" "${DOCS_DIR}"
          rm -rf "${DOCS_DIR}/natural-date-parser/apidocs"
          mkdir -p "${DOCS_DIR}/natural-date-parser/apidocs"
          cp -R target/reports/apidocs/. "${DOCS_DIR}/natural-date-parser/apidocs/"
          cd "${DOCS_DIR}"
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add natural-date-parser/apidocs
            git commit -m "Update API docs from ${GITHUB_SHA}"
            git push origin HEAD
          else
            echo "No API doc changes to publish"
          fi

  deploy:
    name: Deploy to Maven Central
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: [build, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Deploy with Maven
        run: mvn -s .github/maven-settings.xml deploy
